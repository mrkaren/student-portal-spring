<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Students</title>
</head>
<body>
Students list
<a href="/students">Show All Students</a>
<a href="/students/add">Add Student</a>
<table border="1">
    <tr>
        <th>Id</th>
        <th>Name</th>
        <th>Surname</th>
        <th>Email</th>
        <th>Course</th>
        <th>Skills</th>
    </tr>

    <tr th:each="student : ${students}">
        <td th:text="${student.id}"></td>
        <td th:text="${student.name}"></td>
        <td th:text="${student.surname}"></td>
        <td th:text="${student.email}"></td>
        <td>
            <a th:href="@{/students(courseid=${student.course.id})}"
               th:text="${student.course.name}"
            ></a>

        </td>
        <td>
            <a th:each="skill : ${student.getSkills()}"
               th:text="${skill.name + ' '}"
                  th:href="@{/students(skillId=${skill.id})}"></a>
        </td>
    </tr>

</table>

</body>
</html>
