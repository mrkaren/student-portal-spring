<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Courses</title>
</head>
<body>
<a href="/addCourse">Add Course</a> <br>
Courses
<table>
    <tr>
        <th>id</th>
        <th>name</th>
        <th>price</th>
        <th>action</th>
    </tr>
    <tr th:each="c : ${courses}">
        <td th:text="${c.id}"></td>
        <td th:text="${c.name}"></td>
        <td th:text="${c.price}"></td>
        <td><a th:href="@{/courses/delete(id=${c.id})}">delete</a> </td>
    </tr>
</table>
</body>
</html>
